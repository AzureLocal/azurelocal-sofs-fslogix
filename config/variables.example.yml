# =============================================================================
# variables.example.yml
# Central configuration — single source of truth for all deployment phases.
#
# Copy this file to variables.yml and fill in your values:
#   cp config/variables.example.yml config/variables.yml
#
# DO NOT commit variables.yml — it is excluded by .gitignore.
#
# Key Vault References:
#   Secrets use keyvault:// URIs and are resolved at runtime.
#   Format: keyvault://<vault-name>/<secret-name>
#   NEVER put actual passwords or secrets in this file.
# =============================================================================


# =============================================================================
# Deployment Architecture Choices
#
# These high-level decisions determine which deployment path the tools follow.
# See docs/standards/automation.md for the Deployment Path Matrix.
# =============================================================================
deployment:
  host_volume_layout: "three_volumes"      # three_volumes | single_volume
  guest_volume_layout: "option_b"          # option_a (single volume) | option_b (three volumes)


# =============================================================================
# Azure
# =============================================================================
azure:
  subscription_id: "00000000-0000-0000-0000-000000000000"
  resource_group: "rg-sofs-azl-eus-01"
  location: "eastus"


# =============================================================================
# Key Vault
# =============================================================================
keyvault:
  name: "kv-platform-prod"


# =============================================================================
# Azure Local
# =============================================================================
azure_local:
  cluster_name: "azl-cluster-01"
  custom_location_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azl-cluster/providers/Microsoft.ExtendedLocation/customLocations/azl-cluster-cl"
  logical_network_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azl-cluster/providers/Microsoft.AzureStackHCI/logicalNetworks/lnet-tenant-vlan"
  gallery_image_name: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azl-cluster/providers/microsoft.azurestackhci/marketplaceGalleryImages/img-ws2025-core-g2-v1"
  storage_path_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azl-cluster/providers/Microsoft.AzureStackHCI/storageContainers/sp-vmstore-01"
  storage_path_ids:
    "01": "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azl-cluster/providers/Microsoft.AzureStackHCI/storageContainers/sp-vmstore-01"
    "02": "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azl-cluster/providers/Microsoft.AzureStackHCI/storageContainers/sp-vmstore-02"
    "03": "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azl-cluster/providers/Microsoft.AzureStackHCI/storageContainers/sp-vmstore-03"


# =============================================================================
# Virtual Machines
# =============================================================================
vm:
  prefix: "sofs"
  count: 3
  processors: 4
  memory_mb: 8192
  os_disk_size_gb: 127
  admin_username: "sofs_admin"
  admin_password: "keyvault://kv-platform-prod/sofs-vm-admin-password"
  ips:
    "01": "192.168.1.201"
    "02": "192.168.1.202"
    "03": "192.168.1.203"


# =============================================================================
# Data Disks (for S2D pool)
# =============================================================================
data_disks:
  count: 4
  size_gb: 500
  dynamic: false                           # true = dynamic provisioning (future)


# =============================================================================
# Domain
# =============================================================================
domain:
  fqdn: "iic.local"
  netbios: "IIC"
  join_username: "svc.domainjoin"
  join_password: "keyvault://kv-platform-prod/domain-join-password"
  cluster_ou_path: "OU=SOFS-Cluster,OU=Clusters,OU=Servers,DC=iic,DC=local"
  nodes_ou_path: "OU=SOFS-Cluster,OU=Clusters,OU=Servers,DC=iic,DC=local"


# =============================================================================
# DNS
# =============================================================================
dns_servers:
  - "10.0.1.10"
  - "10.0.1.11"


# =============================================================================
# SOFS (Scale-Out File Server)
#
# Option A (single share): use share_name
# Option B (three shares): use shares list instead
# =============================================================================
sofs:
  name: "FSLogixSOFS"
  cluster_name: "sofs-cluster"
  cluster_ip: "192.168.1.204"
  role_enabled: true
  anti_affinity_rule_name: "SOFS-AntiAffinity"
  smb_encryption: true
  caching_mode: "None"                     # None | Manual | Documents | Programs

  # --- Option A: single share ---
  share_name: "Profiles"

  # --- Option B: three shares (uncomment and remove share_name above) ---
  # shares:
  #   - name: "Profiles"
  #     volume: "Profiles"
  #   - name: "ODFC"
  #     volume: "ODFC"
  #   - name: "AppData"
  #     volume: "AppData"


# =============================================================================
# Storage Spaces Direct (S2D)
#
# Option A (single volume): use volume_name / volume_size_gb / data_copies
# Option B (three volumes): use volumes list instead
# =============================================================================
s2d:
  pool_name: "S2D on sofs-cluster"

  # --- Option A: single volume ---
  volume_name: "FSLogixData"
  volume_size_gb: 2560
  data_copies: 2

  # --- Option B: three volumes (uncomment and remove the three keys above) ---
  # volumes:
  #   - name: "Profiles"
  #     size_gb: 33485         # ~55% — profile containers
  #     data_copies: 2
  #   - name: "ODFC"
  #     size_gb: 21299         # ~35% — Outlook OST, Teams cache
  #     data_copies: 2
  #   - name: "AppData"
  #     size_gb: 6144          # ~10% — per-user AppData redirections
  #     data_copies: 2


# =============================================================================
# Cloud Witness
# =============================================================================
cloud_witness:
  name: "stsofswitnessprod01"
  key_uri: ""
  key_secret: ""


# =============================================================================
# Guest Configuration Engine
# =============================================================================
guest_config_engine: "ansible_create"        # ansible_create | ansible_existing | manual


# =============================================================================
# Ansible Controller (used when guest_config_engine = ansible_create)
# =============================================================================
ansible_controller:
  name: "vm-ansible-sofs-01"
  size: "Standard_B2s"
  admin_username: "ansibleadmin"
  hub_subnet_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-connectivity/providers/Microsoft.Network/virtualNetworks/vnet-hub/subnets/snet-mgmt"
  hub_rg: "rg-connectivity"
  existing_controller_ip: ""
  existing_controller_user: "ansibleadmin"


# =============================================================================
# Host Volumes (reference only — actual provisioning is a prerequisite)
#
# These values document the host storage layout for validation and reporting.
# Host volumes are created directly on the Azure Local cluster before Phase 1.
# =============================================================================
host_volumes:
  prefix: "SOFS-CSV"
  resiliency: "two_way"                    # two_way | three_way
  count: 3
  size_tb: 4.0
  storage_pool_name: "S2D on azl-cluster-01"


# =============================================================================
# Permissions
# =============================================================================
permissions:
  admin_group: "Domain Admins"
  users_group: "AVD-Users"
  avd_users_group: "AVD-Users"


# =============================================================================
# FSLogix
# =============================================================================
fslogix:
  enabled: true
  profile_size_mb: 30000
  volume_type: "VHDX"                      # VHDX | VHD
  flip_flop_name: true
  delete_local_profile: true
  cloud_cache:
    enabled: false
    azure_provider: ""                     # Azure Blob connection string (if Cloud Cache enabled)


# =============================================================================
# Tags
# =============================================================================
tags:
  project: "SOFS"
  environment: "production"
  workload: "FSLogix"
  solution: "sofs-azure-local"
