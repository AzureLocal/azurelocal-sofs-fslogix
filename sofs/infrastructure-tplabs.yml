      azure_subscription_id: "2caa0b8a-a1d6-4f0c-8c03-861787b8315c"

      # Service Principal / App Registration
      service_principal_client_id: "2c57833c-5fe3-4fa3-9699-04f4168c1c0f"
      service_principal_purpose: "Infrastructure Arc onboarding"

      # HCI Resource Provider Object ID
      hci_resource_provider_object_id: "a64ef4d7-d1a4-46cf-b85a-60487dc1e483"

      # Azure Region
      azure_region: "eastus"
      azure_region_short: "eus"
      azure_cloud_type: "Public"

