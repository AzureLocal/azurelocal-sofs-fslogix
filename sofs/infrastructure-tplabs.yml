  # ---------------------------------------------------------------------------
  # Network Intents (ARM parameter: intentList)
  # ---------------------------------------------------------------------------
  # Defines how physical adapters are assigned to traffic types.
  # Each intent maps adapter pairs to Management, Compute, or Storage traffic.
  # Override flags MUST be true when adapter properties differ from defaults
  # (e.g., disabling RDMA on non-RDMA NICs, enabling jumbo frames).
  #
  # RELATED SECTIONS:
  #   - networking.onprem.vlans       — VLAN IDs, subnets, gateways
  #   - compute.azure_local.nodes     — Per-node NIC hardware inventory
  #   - master-registry.yaml          — network_intents schema (line 4883)
  # ---------------------------------------------------------------------------
  network_intents:
    # --- Intent 1: Management ---
    # Embedded NICs — management traffic only (no RDMA, standard MTU)
    - name: "Management"
      traffic_types:                        # compute.azure_local.network_intents[0].traffic_types
        - "Management"
      adapter_names:                        # compute.azure_local.network_intents[0].adapter_names
        - "Embedded NIC 1"
        - "Embedded NIC 2"
      subnet: "192.168.211.0/24"           # networking.onprem.vlans.management.cidr
      gateway: "192.168.211.1"             # networking.onprem.vlans.management.gateway
      vlan_id: 711                         # networking.onprem.vlans.management.id
      dns_servers:                         # networking.onprem.vlans.management.dhcp.dns_servers
        - "10.250.1.36"
        - "10.250.1.37"
      override_virtual_switch_configuration: false
      virtual_switch_configuration_overrides:
        enable_iov: ""
        load_balancing_algorithm: ""
      override_qos_policy: false
      qos_policy_overrides:
        priority_value_8021_action_cluster: "7"
        priority_value_8021_action_smb: "3"
        bandwidth_percentage_smb: "50"
      override_adapter_property: true      # MUST be true — embedded NICs need RDMA disabled
      adapter_property_overrides:
        jumbo_packet: 1514                 # Standard MTU for management
        network_direct: "Disabled"         # Embedded NICs do NOT support RDMA
        network_direct_technology: ""

    # --- Intent 2: Compute ---
    # PCIe NICs — compute/VM traffic only (no RDMA, jumbo frames enabled)
    - name: "Compute"
      traffic_types:                        # compute.azure_local.network_intents[1].traffic_types
        - "Compute"
      adapter_names:                        # compute.azure_local.network_intents[1].adapter_names
        - "SLOT 3 Port 1"
        - "SLOT 6 Port 2"
      override_virtual_switch_configuration: false
      virtual_switch_configuration_overrides:
        enable_iov: ""
        load_balancing_algorithm: ""
      override_qos_policy: false
      qos_policy_overrides:
        priority_value_8021_action_cluster: "7"
        priority_value_8021_action_smb: "3"
        bandwidth_percentage_smb: "50"
      override_adapter_property: true      # MUST be true — compute NICs need RDMA disabled
      adapter_property_overrides:
        jumbo_packet: 9014                 # Jumbo frames for VM traffic
        network_direct: "Disabled"         # Compute intent does not use RDMA
        network_direct_technology: ""

    # --- Intent 3: Storage ---
    # PCIe NICs — storage traffic only (RDMA enabled, jumbo frames, QoS enforced)
    - name: "Storage"
      traffic_types:                        # compute.azure_local.network_intents[2].traffic_types
        - "Storage"
      adapter_names:                        # compute.azure_local.network_intents[2].adapter_names
        - "SLOT 3 Port 2"
        - "SLOT 6 Port 1"
      override_virtual_switch_configuration: false
      virtual_switch_configuration_overrides:
        enable_iov: ""
        load_balancing_algorithm: ""
      override_qos_policy: true            # Storage requires QoS enforcement
      qos_policy_overrides:
        priority_value_8021_action_cluster: "7"
        priority_value_8021_action_smb: "3"
        bandwidth_percentage_smb: "50"
      override_adapter_property: true      # Storage needs RDMA + jumbo frames
      adapter_property_overrides:
        jumbo_packet: 9014                 # Jumbo frames for storage
        network_direct: "Enabled"          # RDMA enabled for storage performance
        network_direct_technology: "RoCEv2" # Mellanox ConnectX adapters

  # ---------------------------------------------------------------------------
  # Storage Networks (ARM parameter: storageNetworkList)
  # ---------------------------------------------------------------------------
  storage_networks:
    - name: "StorageNetwork1"
      adapter_name: "SLOT 3 Port 2"       # Must match Storage intent adapter
      vlan_id: 712                         # networking.onprem.storage.vlans[0].id
    - name: "StorageNetwork2"
      adapter_name: "SLOT 6 Port 1"       # Must match Storage intent adapter
      vlan_id: 713                         # networking.onprem.storage.vlans[1].id

  storage_connectivity_switchless: false   # Switched storage topology (ToR switches)
  enable_storage_auto_ip: true             # Automatic IP assignment for storage adapters

  logical_networks:
    # ── VLAN 711 — Management-Compute (node management, cluster VIP, management VMs) ──
    - name: "lnet-tplabs-management-711"               # networking.logical_networks[0].name
