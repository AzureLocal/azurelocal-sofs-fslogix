# =============================================================================
# validate-automation.yml — CI validation for all 5 deployment tools
# =============================================================================
# Triggered on PRs and pushes that touch source code, config, or tests.
# Validates schema, lints code, and runs unit tests for each tool.
# =============================================================================

name: Validate Automation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/validate-automation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Schema Validation
  # ---------------------------------------------------------------------------
  schema:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate variables.example.yml against schema
        run: |
          python3 -c "
          import yaml, json, sys
          from jsonschema import validate, ValidationError

          with open('config/variables/variables.example.yml') as f:
              data = yaml.safe_load(f)

          with open('config/variables/schema/variables.schema.json') as f:
              schema = json.load(f)

          try:
              validate(instance=data, schema=schema)
              print('✅ config/variables/variables.example.yml passes schema validation')
          except ValidationError as e:
              print(f'❌ Schema validation failed: {e.message}')
              print(f'   Path: {\" > \".join(str(p) for p in e.absolute_path)}')
              sys.exit(1)
          "

  # ---------------------------------------------------------------------------
  # PowerShell — PSScriptAnalyzer + Pester
  # ---------------------------------------------------------------------------
  powershell:
    name: PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser
          Install-Module powershell-yaml -Force -Scope CurrentUser

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./src/powershell -Recurse -Severity Warning
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' })
          $results | Format-Table -AutoSize
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer found $($errors.Count) blocking issue(s)" }

      - name: Syntax check
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path ./src/powershell, ./tests -Filter *.ps1 -Recurse | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) { $errors += "$($_.Name): $parseErrors" }
          }
          if ($errors.Count -gt 0) { throw "Syntax errors:`n$($errors -join "`n")" }

      - name: Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'test-results/pester.xml'
          $config.TestResult.OutputFormat = 'JUnitXml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: test-results/pester.xml

  # ---------------------------------------------------------------------------
  # Terraform — fmt + validate + test
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~> 1.5'

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Test
        run: terraform test

  # ---------------------------------------------------------------------------
  # Bicep — build + lint
  # ---------------------------------------------------------------------------
  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Azure CLI
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: echo "Azure CLI installed"

      - name: Bicep Build (syntax + lint)
        env:
          AZURE_CONFIG_DIR: /tmp/.azure
        run: az bicep build --file src/bicep/main.bicep --stdout > /dev/null

  # ---------------------------------------------------------------------------
  # ARM — verify compiled template matches Bicep output
  # ---------------------------------------------------------------------------
  arm:
    name: ARM
    needs: bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Azure CLI
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: echo "Azure CLI installed"

      - name: Compile Bicep to ARM
        env:
          AZURE_CONFIG_DIR: /tmp/.azure
        run: az bicep build --file src/bicep/main.bicep --outfile /tmp/compiled.json

      - name: Compare with committed ARM template
        run: |
          if ! diff <(python3 -c "import json; print(json.dumps(json.load(open('src/arm/azuredeploy.json')), sort_keys=True, indent=2))" ) \
                     <(python3 -c "import json; print(json.dumps(json.load(open('/tmp/compiled.json')), sort_keys=True, indent=2))" ); then
            echo "❌ src/arm/azuredeploy.json is out of sync with src/bicep/main.bicep"
            echo "   Run: az bicep build --file src/bicep/main.bicep --outfile src/arm/azuredeploy.json"
            exit 1
          fi
          echo "✅ ARM template matches Bicep source"

  # ---------------------------------------------------------------------------
  # Contract Validation — cross-tool consistency checks
  # ---------------------------------------------------------------------------
  contract:
    name: Contract Validation
    needs: [schema, bicep]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate schema $defs.examples
        run: |
          python3 -c "
          import json, sys
          from jsonschema import validate, ValidationError

          with open('config/variables/schema/variables.schema.json') as f:
              schema = json.load(f)

          examples = schema.get('\$defs', {}).get('examples', {})
          if not examples:
              print('⚠️  No \$defs.examples in schema — skipping')
              sys.exit(0)

          failed = 0
          for name, example in examples.items():
              try:
                  validate(instance=example, schema=schema)
                  print(f'✅ Example \"{name}\" passes schema validation')
              except ValidationError as e:
                  print(f'❌ Example \"{name}\" failed: {e.message}')
                  failed += 1

          if failed:
              sys.exit(1)
          "

      - name: Verify Bicep pass-through annotations exist
        run: |
          # Ensure guest-phase params have passThrough metadata
          count=$(grep -c "passThrough: true" src/bicep/main.bicep || true)
          echo "Found $count pass-through annotations in main.bicep"
          if [ "$count" -lt 5 ]; then
            echo "❌ Expected at least 5 pass-through parameter annotations"
            exit 1
          fi
          echo "✅ Pass-through contract: $count annotated parameters"

      - name: Verify ARM parity with pass-through params
        run: |
          # Pass-through params in Bicep should appear in ARM parameters
          python3 -c "
          import json, re

          with open('src/arm/azuredeploy.json') as f:
              arm = json.load(f)

          with open('src/bicep/main.bicep') as f:
              bicep = f.read()

          # Find pass-through param names from Bicep
          pattern = r'@metadata\(\{[^}]*passThrough:\s*true[^}]*\}\)\s*(?:@\w+[^\n]*\n\s*)*param\s+(\w+)'
          pt_params = re.findall(pattern, bicep)
          print(f'Pass-through params in Bicep: {len(pt_params)}')

          # Verify each exists in ARM parameters
          arm_params = set(arm.get('parameters', {}).keys())
          missing = [p for p in pt_params if p not in arm_params]
          if missing:
              print(f'❌ Missing in ARM: {missing}')
              exit(1)
          print('✅ All pass-through params present in ARM template')
          "

      - name: Verify legacy alias normalization
        run: |
          python3 -c "
          import yaml, sys

          with open('config/variables/variables.example.yml') as f:
              data = yaml.safe_load(f)

          layout = data.get('deployment', {}).get('guest_layout', '')
          if layout not in ('single', 'triple'):
              print(f'❌ variables.example.yml uses non-canonical layout: {layout}')
              sys.exit(1)
          print(f'✅ variables.example.yml uses canonical layout: {layout}')
          "

      - name: Verify documentation matrix freshness
        run: |
          python3 -c "
          import sys, os

          required_docs = {
              'docs/reference/phase-ownership.md': [
                  '## 11-Phase Deployment Model',
                  '## Phase 0 Decision Tree',
                  '## Pass-Through Parameter Contract',
                  '## Legacy Naming Deprecation Timeline',
                  '## Cross-Repository Dependencies',
              ],
              'tests/VALIDATION-MATRIX.md': [
                  '## The 10 Scenarios',
                  '## Validation Matrix',
                  '## Phase Ownership by Tool',
                  '## Pre-Flight Validation Report',
              ],
          }

          failed = 0
          for filepath, sections in required_docs.items():
              if not os.path.exists(filepath):
                  print(f'❌ Missing required doc: {filepath}')
                  failed += 1
                  continue

              with open(filepath) as f:
                  content = f.read()

              missing = [s for s in sections if s not in content]
              if missing:
                  print(f'❌ {filepath} missing sections: {missing}')
                  failed += 1
              else:
                  print(f'✅ {filepath} has all {len(sections)} required sections')

          if failed:
              sys.exit(1)
          "

  # ---------------------------------------------------------------------------
  # Ansible — ansible-lint + yamllint
  # ---------------------------------------------------------------------------
  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ansible-core ansible-lint yamllint

      - name: YAML Lint
        run: |
          yamllint -d relaxed src/ansible/

      - name: Ansible Lint
        run: |
          ansible-lint src/ansible/playbooks/ || true
          # Note: ansible-lint may report warnings for Windows-specific modules
          # that aren't installed in CI. Use || true to allow warnings,
          # but syntax errors will still cause ansible-playbook --syntax-check to fail.

      - name: Ansible Syntax Check
        run: |
          for playbook in src/ansible/playbooks/*.yml; do
            echo "Checking: $playbook"
            ansible-playbook --syntax-check "$playbook" -i src/ansible/inventory/hosts.example.yml 2>&1 || true
          done
