site_name: Azure Local SOFS for FSLogix
site_description: Infrastructure-as-Code and automation for deploying a Scale Out File Server on Azure Local for FSLogix profile containers
site_url: https://azurelocal.github.io/azurelocal-sofs-fslogix/
repo_url: https://github.com/AzureLocal/azurelocal-sofs-fslogix
repo_name: AzureLocal/azurelocal-sofs-fslogix

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md
  - Guides:
      - CI/CD Pipelines: guides/cicd-pipelines.md
      - Runner & Agent Setup: guides/runner-setup.md
      - Secrets Management: guides/secrets-management.md
  - Reference:
      - Variables: reference/variables.md
      - SOFS Deployment Guide: reference/sofs-deployment-guide.md
  - Standards:
      - Overview: standards/index.md
      - Scripts: standards/scripts.md
      - Documentation: standards/documentation.md
      - Solutions: standards/solutions.md
      - Variables: standards/variables.md
      - Examples: standards/examples.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
