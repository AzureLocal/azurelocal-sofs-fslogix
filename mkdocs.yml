site_name: Azure Local SOFS for FSLogix
site_description: Infrastructure-as-Code and automation for deploying a Scale Out File Server on Azure Local for FSLogix profile containers
site_url: https://azurelocal.github.io/azurelocal-sofs-fslogix/
repo_url: https://github.com/AzureLocal/azurelocal-sofs-fslogix
repo_name: AzureLocal/azurelocal-sofs-fslogix

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture:
      - Overview: architecture/overview.md
      - Storage Design: architecture/storage-design.md
      - Capacity Planning: architecture/capacity-planning.md
      - AVD Considerations: architecture/avd-considerations.md
      - Scenarios: architecture/scenarios.md
  - Deployment:
      - Prerequisites: deployment/prerequisites.md
      - Deployment Paths: deployment/paths.md
      - Terraform: deployment/terraform.md
      - Bicep: deployment/bicep.md
      - ARM Templates: deployment/arm.md
      - PowerShell: deployment/powershell.md
      - Ansible: deployment/ansible.md
      - Validation: deployment/validation.md
  - Configuration:
      - FSLogix: configuration/fslogix.md
      - Permissions: configuration/permissions.md
      - Antivirus Exclusions: configuration/antivirus.md
  - Operations:
      - Troubleshooting: operations/troubleshooting.md
      - CI/CD Pipelines: operations/cicd-pipelines.md
      - Runner & Agent Setup: operations/runner-setup.md
      - Secrets Management: operations/secrets-management.md
  - Reference:
      - Variables: reference/variables.md
      - SOFS Design & Deployment Guide: reference/sofs-design-and-deployment-guide.md
  - Standards:
      - Overview: standards/index.md
      - Documentation: standards/documentation.md
      - Scripting: standards/scripting.md
      - Variables: standards/variables.md
      - Naming Conventions: standards/naming.md
      - Solutions: standards/solutions.md
      - Infrastructure: standards/infrastructure.md
      - Automation: standards/automation.md
      - Examples & IIC: standards/examples.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/countrycloudboy
      name: CountryCloudBoy on X
    - icon: fontawesome/brands/github
      link: https://github.com/AzureLocal/azurelocal-sofs-fslogix
      name: GitHub Repository
    - icon: fontawesome/solid/globe
      link: https://azurelocal.cloud
      name: Azure Local Community
  homepage: https://azurelocal.cloud

copyright: >-
  Copyright &copy; 2025 Azure Local. Designed and maintained by
  <a href="https://www.hybridsolutions.cloud">Hybrid Cloud Solutions</a>.
