---
# playbooks/configure-fslogix.yml
# Applies FSLogix registry settings to AVD session hosts.
#
# Usage:
#   ansible-playbook -i inventory/inventory.yml playbooks/configure-fslogix.yml

- name: Configure FSLogix on AVD session hosts
  hosts: avd_session_hosts
  gather_facts: false

  vars:
    access_point: "{{ sofs_access_point }}"
    share_name: "{{ sofs_share_name | default('FSLogix') }}"
    fslogix_vhd_location: "\\\\{{ access_point }}\\{{ share_name }}"
    fslogix_reg_path: "HKLM:\\SOFTWARE\\FSLogix\\Profiles"
    fslogix_profile_size_mb: "{{ sofs_fslogix_profile_size_mb | default(30000) | int }}"
    fslogix_volume_type: "{{ sofs_fslogix_volume_type | default('VHDX') }}"
    cloud_cache_enabled: "{{ sofs_cloud_cache_enabled | default(false) | bool }}"
    guest_volume_layout_raw: "{{ sofs_guest_volume_layout | default('single') }}"
    guest_volume_layout: "{{ 'single' if guest_volume_layout_raw in ['single', 'option_a'] else 'triple' if guest_volume_layout_raw in ['triple', 'option_b'] else guest_volume_layout_raw }}"
    sofs_shares_list: "{{ sofs_shares | default([]) }}"

  tasks:
    - name: Ensure FSLogix Profiles registry key exists
      ansible.windows.win_regedit:
        path: "{{ fslogix_reg_path }}"
        state: present

    - name: Enable FSLogix profile containers
      ansible.windows.win_regedit:
        path: "{{ fslogix_reg_path }}"
        name: Enabled
        data: 1
        type: dword

    - name: Set VHD locations
      ansible.windows.win_regedit:
        path: "{{ fslogix_reg_path }}"
        name: VHDLocations
        data: "{{ fslogix_vhd_location }}"
        type: string
      when: not cloud_cache_enabled

    - name: Enable FlipFlopProfileDirectoryName (SID_Username format)
      ansible.windows.win_regedit:
        path: "{{ fslogix_reg_path }}"
        name: FlipFlopProfileDirectoryName
        data: 1
        type: dword

    - name: Delete local profile when VHD should apply
      ansible.windows.win_regedit:
        path: "{{ fslogix_reg_path }}"
        name: DeleteLocalProfileWhenVHDShouldApply
        data: 1
        type: dword

    - name: Set profile container size (MB)
      ansible.windows.win_regedit:
        path: "{{ fslogix_reg_path }}"
        name: SizeInMBs
        data: "{{ fslogix_profile_size_mb | int }}"
        type: dword

    - name: Set volume type (VHD or VHDX)
      ansible.windows.win_regedit:
        path: "{{ fslogix_reg_path }}"
        name: VolumeType
        data: "{{ fslogix_volume_type }}"
        type: string

    - name: Verify FSLogix configuration
      ansible.windows.win_powershell:
        script: |
          Get-ItemProperty -Path "{{ fslogix_reg_path }}" |
            Select-Object Enabled, VHDLocations, FlipFlopProfileDirectoryName, SizeInMBs, VolumeType
      register: fslogix_config

    - name: Show FSLogix configuration
      ansible.builtin.debug:
        var: fslogix_config.output

    # ---------------------------------------------------------------
    # Cloud Cache — CCDLocations registry (only when enabled)
    # ---------------------------------------------------------------
    - name: Build CCDLocations value for Cloud Cache
      ansible.builtin.set_fact:
        _cc_ccd_locations: >-
          {%- set parts = [] -%}
          {%- if guest_volume_layout == 'single' -%}
            {%- set _ = parts.append('type=smb,connectionString=\\\\' ~ access_point ~ '\\' ~ share_name) -%}
          {%- else -%}
            {%- for s in sofs_shares_list -%}
              {%- set _ = parts.append('type=smb,connectionString=\\\\' ~ access_point ~ '\\' ~ s.name) -%}
            {%- endfor -%}
          {%- endif -%}
          {%- set providers = sofs_cloud_cache_providers | default([]) -%}
          {%- if providers | length > 0 -%}
            {%- for p in providers -%}
              {%- set _ = parts.append('type=' ~ p.type ~ ',connectionString=' ~ p.connectionString) -%}
            {%- endfor -%}
          {%- elif sofs_cloud_cache_azure_provider | default('') | length > 0 -%}
            {%- set _ = parts.append('type=azure,connectionString=' ~ sofs_cloud_cache_azure_provider) -%}
          {%- endif -%}
          {{ parts | join(';') }}
      when: cloud_cache_enabled

    - name: Set CCDLocations registry value
      ansible.windows.win_regedit:
        path: "{{ fslogix_reg_path }}"
        name: CCDLocations
        data: "{{ _cc_ccd_locations }}"
        type: expandstring
      when:
        - cloud_cache_enabled
        - _cc_ccd_locations is defined

    - name: Remove VHDLocations when Cloud Cache is active
      ansible.windows.win_regedit:
        path: "{{ fslogix_reg_path }}"
        name: VHDLocations
        state: absent
      when: cloud_cache_enabled
