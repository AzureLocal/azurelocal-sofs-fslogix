---
# inventory/hosts.example.yml
# Copy to hosts.yml and fill in your values.
# DO NOT commit hosts.yml if it contains credentials – it is excluded by .gitignore.

all:
  vars:
    ansible_user: "{{ lookup('env', 'ANSIBLE_WIN_USER') }}"
    ansible_password: "{{ lookup('env', 'ANSIBLE_WIN_PASSWORD') }}"
    ansible_connection: winrm
    ansible_winrm_transport: kerberos        # or 'ntlm' / 'basic' depending on your setup
    ansible_winrm_server_cert_validation: ignore

  children:
    # Azure Local host cluster nodes (for Phase 3 anti-affinity)
    host_cluster:
      hosts:
        azl-node-01:
          ansible_host: 10.0.0.1
        azl-node-02:
          ansible_host: 10.0.0.2

    sofs_nodes:
      hosts:
        SOFS-01:
          ansible_host: 192.168.1.11
        SOFS-02:
          ansible_host: 192.168.1.12
      vars:
        sofs_access_point: "FSLogixSOFS"
        sofs_share_name: "FSLogix"

    avd_session_hosts:
      hosts:
        avd-host-01:
          ansible_host: 192.168.2.11
        avd-host-02:
          ansible_host: 192.168.2.12
